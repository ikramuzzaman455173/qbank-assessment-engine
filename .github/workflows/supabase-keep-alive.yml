name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 06:00 UTC every 2 days to keep the Supabase database active
    - cron: "0 6 */2 * *"
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat to Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Skipping heartbeat: SUPABASE_URL or SUPABASE_ANON_KEY secrets not set in GitHub repository."
            exit 0
          fi

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1")
          
          echo "Supabase Response HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 204 ]; then
            echo "Successfully sent keep-alive heartbeat. Database is active."
            exit 0
          else
            echo "Warning: Received HTTP $HTTP_STATUS from Supabase."
            exit 0
          fi
