name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 06:00 UTC every 2 days to keep the Supabase database active
    - cron: "0 6 */2 * *"
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat to Supabase REST API
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_3Oh3hPJIUfAh1b1I835h_g__7F3KhHW' }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_3Oh3hPJIUfAh1b1I835h_g__7F3KhHW' }}" \
            "${{ secrets.SUPABASE_URL || 'https://fyokwegeezebfcktgdwu.supabase.co' }}/rest/v1/profiles?select=id&limit=1")
          
          echo "Supabase Response HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 204 ]; then
            echo "Successfully sent keep-alive heartbeat. Database is active."
            exit 0
          else
            echo "Warning: Received HTTP $HTTP_STATUS from Supabase."
            exit 0
          fi
